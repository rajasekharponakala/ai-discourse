name: Track X posts

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours (off the top of the hour to avoid queue spikes)
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated handles to scrape now (blank = normal rotation)"
        required: false
        default: ""
      accounts_per_run:
        description: "Override accounts per run: a number or \"all\" (blank = accounts.json setting)"
        required: false
        default: ""

permissions:
  contents: write

# Never let two scrapes race on data/posts.json.
concurrency:
  group: track-x
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape X via Firecrawl
        env:
          FIRECRAWL_API: ${{ secrets.FIRECRAWL_API }}
          ONLY: ${{ github.event.inputs.only }}
          ACCOUNTS_PER_RUN: ${{ github.event.inputs.accounts_per_run }}
        run: |
          if [ -z "$FIRECRAWL_API" ]; then
            echo "::error title=Missing secret::Add a repository secret named FIRECRAWL_API (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          args=()
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ -n "$ACCOUNTS_PER_RUN" ] && args+=(--accounts-per-run "$ACCOUNTS_PER_RUN")
          # The script handles per-URL failures itself (logged as warnings);
          # it only exits non-zero on misconfiguration.
          python scripts/scrape_x.py "${args[@]}"

      - name: Summarise run
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json
          s = json.load(open("data/scrape_state.json"))
          r = (s.get("runs") or [{}])[0]
          p = json.load(open("data/posts.json"))
          print("### X tracker run")
          print(f"- Accounts scraped: {', '.join(r.get('accounts', []))}")
          print(f"- OK accounts: {r.get('ok_accounts')} · fresh posts: {r.get('fresh_posts')} · published: {len(p.get('posts', []))}")
          if r.get("errors"):
              print("\n**Errors**")
              for e in r["errors"]:
                  print(f"- `{e[:200]}`")
          print("\n**Top 5**")
          for post in p.get("posts", [])[:5]:
              print(f"1. [{post['sensational_headline']}]({post['url']}) — @{post['author_handle']} ({post.get('score')})")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json data/scrape_state.json
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: update tracked X posts ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Retry in case someone pushed in the meantime.
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push data update"
          exit 1
